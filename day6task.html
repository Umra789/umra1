<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        label {
            display: block;
            color: #555;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 14px;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #age {
            margin-top: 25px;
            padding: 20px;
            background-color: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 6px;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            min-height: 40px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Age Calculator</h1>
        <label for="one">Enter your birth date</label>
        <input id="one" type="date" placeholder="mm/dd/yyyy">
        <button onclick="clk()">Calculate Age</button>
        <p id="age"></p>
    </div>
    <script>
          function clk(){
                 var a = document.querySelector("#one").value;
                 if(!a){
                      document.getElementById('age').textContent = 'Please select a birth date.';
                      return;
                 }
                 let birthDate = new Date(a);
                 let today = new Date();
                 let years = today.getFullYear() - birthDate.getFullYear();
                 let months = today.getMonth() - birthDate.getMonth();
                 let days = today.getDate() - birthDate.getDate();
                 if(days < 0){
                     months--;
                     // get days in previous month
                     const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                     days += prevMonth.getDate();
                 }
                 if(months < 0){
                     years--;
                     months += 12;
                 }

                 document.getElementById("age").textContent = "You are " +
                 years + " years, " +
                 months + " months, " +
                 days + " days old.";

          }
    </script>
</body>
</html>
